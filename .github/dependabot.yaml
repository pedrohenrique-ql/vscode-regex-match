version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore
    target-branch: canary
    groups:
      npm:
        patterns:
          - '*'

    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

      - dependency-name: 'mocha'
        update-types:
          - version-update:semver-major

      - dependency-name: '@types/mocha'
        update-types:
          - version-update:semver-major

      - dependency-name: '@types/vscode'
        update-types:
          - version-update:semver-minor

      # typescript-eslint has no support for TS 7 yet: the native (Go) compiler
      # does not expose the JS API its type-aware rules need. Unpin when the
      # TS 7.1 API lands and typescript-eslint supports it.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore
    target-branch: canary
    reviewers:
      - pedrohenrique-ql
    groups:
      github-actions:
        patterns:
          - '*'
